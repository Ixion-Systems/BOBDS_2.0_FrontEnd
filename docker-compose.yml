version: '3.8'

services:
  backend:
    build: 
      context: ../BOBDS_2.0_BackEnd/server
      dockerfile: Dockerfile
    container_name: bobds-backend
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    env_file:
      - ../BOBDS_2.0_BackEnd/server/.env
    volumes:
      - backend_data:/app/data
    networks:
      - bobds-network

  simulator:
    build:
      context: ../BODS_2.0_Simulator
      dockerfile: Dockerfile
    container_name: bobds-simulator
    ports:
      - "7777:7777"
    env_file:
      - ../BODS_2.0_Simulator/.env
    networks:
      - bobds-network
    depends_on:
      - backend

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: bobds-frontend
    ports:
      - "80:80"
    networks:
      - bobds-network
    depends_on:
      - backend

networks:
  bobds-network:
    driver: bridge

volumes:
  backend_data:
